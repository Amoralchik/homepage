<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230a1428'/%3E%3Crect x='7' y='3' width='2' height='2' fill='%236c8cff'/%3E%3Crect x='5' y='5' width='6' height='2' fill='%236c8cff'/%3E%3Crect x='3' y='7' width='10' height='2' fill='%236c8cff'/%3E%3Crect x='5' y='9' width='2' height='4' fill='%236c8cff'/%3E%3Crect x='9' y='9' width='2' height='4' fill='%236c8cff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>

  <main class="page">
    <section class="search" id="search">
      <input
        id="query"
        type="text"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        placeholder="Search the web…"
        aria-label="Search the web"
      />

      <div class="search-row">
        <div class="provider-wrap" id="provider-wrap">
          <button class="provider-btn" id="provider-btn" type="button"
                  aria-haspopup="listbox" aria-expanded="false" title="Search provider">
            <span class="provider-ico" id="provider-ico" aria-hidden="true">G</span>
            <span class="provider-name" id="provider-name">Google</span>
            <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <ul class="menu" id="menu" role="listbox" aria-label="Search provider"></ul>
        </div>

        <button class="submit" id="submit" type="button" title="Search (Enter)" aria-label="Search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <div class="suggest" id="suggest" role="listbox" aria-label="Search suggestions"></div>
    </section>

    <div class="pill" id="pill">
      <span class="pill-seg">home</span>
      <span class="pill-slash">/</span>
      <span class="pill-seg" id="clock">--:--</span>
      <span class="pill-dot">·</span>
      <span class="pill-seg" id="date">&nbsp;</span>
    </div>
  </main>

  <footer class="hint">
    <span class="key">/</span> focus &nbsp;·&nbsp; <span class="key">Enter</span> search &nbsp;·&nbsp; <span class="key">Ctrl K</span> from anywhere
  </footer>

  <script src="app.js"></script>
</body>
</html>
