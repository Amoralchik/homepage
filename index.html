<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230a1428'/%3E%3Crect x='7' y='3' width='2' height='2' fill='%236c8cff'/%3E%3Crect x='5' y='5' width='6' height='2' fill='%236c8cff'/%3E%3Crect x='3' y='7' width='10' height='2' fill='%236c8cff'/%3E%3Crect x='5' y='9' width='2' height='4' fill='%236c8cff'/%3E%3Crect x='9' y='9' width='2' height='4' fill='%236c8cff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>

  <main class="page">
    <div class="center-wrap">
      <section class="search" id="search">
      <input
        id="query"
        type="text"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        placeholder="Search the web…"
        aria-label="Search the web"
      />

      <div class="vanish-ph" id="vanish-ph" aria-hidden="true">Search the web…</div>

      <div class="search-row">
        <div class="provider-wrap" id="provider-wrap">
          <button class="provider-btn" id="provider-btn" type="button"
                  aria-haspopup="listbox" aria-expanded="false" title="Search provider">
            <span class="provider-ico" id="provider-ico" aria-hidden="true">G</span>
            <span class="provider-name" id="provider-name">Google</span>
            <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <ul class="menu" id="menu" role="listbox" aria-label="Search provider"></ul>
        </div>

        <button class="submit" id="submit" type="button" title="Search (Enter)" aria-label="Search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <div class="suggest" id="suggest" role="listbox" aria-label="Search suggestions"></div>
    </section>

    <div class="pill" id="pill">
      <span class="pill-seg" id="pill-label">home</span>
      <span class="pill-slash">/</span>
      <span class="pill-seg" id="clock">--:--</span>
      <span class="pill-dot">·</span>
      <span class="pill-seg" id="date">&nbsp;</span>
    </div>
    </div>
  </main>

  <button class="settings-btn" id="settings-btn" type="button" aria-label="Settings" aria-expanded="false">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="2"/>
      <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.09a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.09a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <div class="settings" id="settings">
    <label class="set-row">
      <span class="set-name">Text</span>
      <input class="set-input" id="set-label" type="text" maxlength="24" spellcheck="false"
             autocomplete="off" placeholder="home" aria-label="Pill text" />
    </label>
    <div class="set-row">
      <span class="set-name">Phase</span>
      <div class="phase-opts" id="phase-opts" role="group" aria-label="Freeze time of day">
        <button type="button" data-phase="auto">Auto</button>
        <button type="button" data-phase="morning">Morning</button>
        <button type="button" data-phase="day">Day</button>
        <button type="button" data-phase="evening">Evening</button>
        <button type="button" data-phase="night">Night</button>
      </div>
    </div>
    <div class="set-row">
      <span class="set-name">Theme</span>
      <div class="phase-opts" id="theme-opts" role="group" aria-label="Celestial theme">
        <button type="button" data-theme="classic">Classic</button>
        <button type="button" data-theme="dark">Dark</button>
        <button type="button" data-theme="bright">Bright</button>
        <button type="button" data-theme="cyberpunk">Cyber</button>
        <button type="button" data-theme="violet">Violet</button>
        <button type="button" data-theme="red">Red</button>
        <button type="button" data-theme="green">Green</button>
        <button type="button" data-theme="blue">Blue</button>
        <button type="button" data-theme="rose">Rose</button>
      </div>
    </div>
    <div class="set-row">
      <span class="set-name">Bg</span>
      <div class="phase-opts" id="bg-opts" role="group" aria-label="Background style">
        <button type="button" data-bg="scene">Scene</button>
        <button type="button" data-bg="aurora">Aurora</button>
        <button type="button" data-bg="grid">Grid</button>
        <button type="button" data-bg="lamp">Lamp</button>
        <button type="button" data-bg="noise">Noise</button>
        <button type="button" data-bg="particles">Particles</button>
        <button type="button" data-bg="retro">Retro</button>
        <button type="button" data-bg="shooting">Shooting</button>
        <button type="button" data-bg="grain">Grain</button>
        <button type="button" data-bg="halftone">Halftone</button>
      </div>
    </div>
    <div class="set-row">
      <span class="set-name">Wall</span>
      <div class="wall-actions">
        <button type="button" class="wall-btn" id="wall-open">Wallpaper…</button>
        <button type="button" class="wall-btn" id="wall-clear">Clear</button>
      </div>
    </div>
    <div class="set-row">
      <span class="set-name">Dots</span>
      <input type="range" id="dot-size" class="dot-slider" min="8" max="26" step="2" value="14" aria-label="Halftone dot size" />
      <span class="set-val" id="dot-size-val">14</span>
    </div>
    <div class="set-row">
      <span class="set-name">Show</span>
      <div class="phase-opts" id="show-opts" role="group" aria-label="Show or hide elements">
        <button type="button" data-show="celestial">Planet</button>
        <button type="button" data-show="stars">Stars</button>
        <button type="button" data-show="input">Input</button>
        <button type="button" data-show="time">Time</button>
        <button type="button" data-show="help">Help</button>
        <button type="button" data-show="pulse">Pulse</button>
      </div>
    </div>
  </div>

  <div class="wall-modal" id="wall-modal" aria-hidden="true">
    <div class="wall-box" role="dialog" aria-label="Set wallpaper">
      <header class="wall-head">
        <span class="wall-title">WALLPAPER</span>
        <button type="button" class="mod-icon-btn" id="wall-close" aria-label="Close">×</button>
      </header>
      <div class="wall-drop" id="wall-drop">
        <strong>Drop an image here</strong>
        <span>or pick one below · saved locally, never uploaded</span>
      </div>
      <div class="wall-url-row">
        <input type="text" id="wall-url" placeholder="paste image URL…" spellcheck="false" autocomplete="off" />
        <button type="button" class="wall-btn" id="wall-url-load">Load</button>
      </div>
      <div class="wall-actions-row">
        <button type="button" class="wall-btn" id="wall-browse">Browse files…</button>
        <button type="button" class="wall-btn" id="wall-clear">Clear wallpaper</button>
        <input type="file" id="wall-input" accept="image/*" hidden />
      </div>
    </div>
  </div>

  <footer class="hint">
    <span class="key">/</span> focus &nbsp;·&nbsp; <span class="key">Enter</span> search &nbsp;·&nbsp; <span class="key">Ctrl K</span> from anywhere
  </footer>

  <button class="mod-tab" id="mod-tab" type="button" aria-label="Toggle widget layer" aria-expanded="false">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <rect x="3" y="3" width="7.5" height="7.5" rx="1.5" stroke="currentColor" stroke-width="2"/>
      <rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5" stroke="currentColor" stroke-width="2"/>
      <rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5" stroke="currentColor" stroke-width="2"/>
      <rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5" stroke="currentColor" stroke-width="2"/>
    </svg>
  </button>

  <aside class="mod-layer" id="mod-layer" aria-label="Widget layer">
    <header class="mod-head">
      <span class="mod-title">WIDGETS</span>
      <div class="mod-head-actions">
        <button class="mod-icon-btn" id="mod-add" type="button" title="Add widget" aria-label="Add widget">+</button>
        <button class="mod-icon-btn" id="mod-hide" type="button" title="Hide layer" aria-label="Hide layer">×</button>
      </div>
      <div class="mod-add-menu" id="mod-add-menu"></div>
    </header>
    <div class="mod-body" id="mod-body"></div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
